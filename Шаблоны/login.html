<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Музыкальная коллекция</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#ff1a40' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
    </script>
    <style>
        .neon-glow { box-shadow: 0 0 6px rgba(255,26,64,0.7), 0 0 12px rgba(255,26,64,0.4); }
        .neon-text { text-shadow: 0 0 4px rgba(255,26,64,0.6); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-bold text-gray-900 neon-text flex items-center justify-center gap-2">🎵 Музыкальная коллекция</a>
            <p class="text-gray-500 mt-2">Войдите, чтобы управлять своей медиатекой</p>
        </div>
        
        <form class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" placeholder="you@example.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
            </div>
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary">
                    <span class="text-gray-600">Запомнить меня</span>
                </label>
                <a href="#" class="text-primary hover:underline">Забыли пароль?</a>
            </div>
            <button type="submit" class="w-full py-2.5 bg-primary text-white rounded-lg font-semibold hover:opacity-90 transition neon-glow">Войти</button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Нет аккаунта? <a href="#" class="text-primary hover:underline font-medium">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>

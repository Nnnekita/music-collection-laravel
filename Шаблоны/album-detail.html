<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Horizons — Музыкальная коллекция</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#ff1a40' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
    </script>
    <style>
        .neon-glow { box-shadow: 0 0 6px rgba(255,26,64,0.7), 0 0 12px rgba(255,26,64,0.4); }
        .neon-text { text-shadow: 0 0 4px rgba(255,26,64,0.6); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <nav class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-gray-900 flex items-center gap-2 hover:text-primary transition neon-text">🎵 Музыкальная коллекция</a>
            <a href="login.html" class="px-4 py-2 text-sm bg-primary text-white rounded-lg hover:opacity-90 transition font-medium">Войти</a>
        </nav>
    </header>

    <main class="flex-1 container mx-auto px-4 py-8 md:py-12">
        <div class="flex flex-col md:flex-row gap-8 lg:gap-12 mb-10">
            <div class="w-full md:w-72 lg:w-80 flex-shrink-0">
                <img src="https://placehold.co/400x400/ff1a40/ffffff?text=Cover" class="rounded-xl shadow-lg neon-glow border border-gray-200 w-full aspect-square object-cover">
            </div>
            <div class="flex flex-col justify-end gap-4">
                <span class="text-xs font-bold uppercase tracking-wider text-primary">Альбом • 2024</span>
                <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900">Neon Horizons</h1>
                <a href="artists.html" class="text-lg text-gray-700 hover:text-primary transition">Synthwave Project</a>
                <div class="flex flex-wrap gap-3 text-sm text-gray-500">
                    <span>8 треков</span><span>•</span><span>34 мин</span><span>•</span><span>Электроника</span>
                </div>
                <div class="flex flex-wrap gap-3 mt-4">
                    <button class="px-6 py-2.5 bg-primary text-white rounded-full font-semibold neon-glow hover:scale-105 transition">▶ Слушать</button>
                    <button class="px-4 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-full hover:border-primary hover:text-primary transition">♡ В коллекцию</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="grid grid-cols-12 gap-4 px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-100 bg-gray-50">
                <div class="col-span-2 sm:col-span-1 text-center">#</div>
                <div class="col-span-7">Название</div>
                <div class="col-span-3 hidden sm:block text-center">Прослушивания</div>
                <div class="col-span-5 sm:col-span-3 text-right">⏱</div>
            </div>
            <div class="divide-y divide-gray-100">
                <div class="group grid grid-cols-12 gap-4 px-4 py-3 hover:bg-red-50/50 transition items-center">
                    <div class="col-span-2 sm:col-span-1 text-center text-sm text-gray-500">1</div>
                    <div class="col-span-7 font-medium text-gray-900 group-hover:text-primary transition">Midnight Drive</div>
                    <div class="col-span-3 hidden sm:block text-center text-sm text-gray-400">1.2M</div>
                    <div class="col-span-5 sm:col-span-3 text-right text-sm text-gray-500">4:12</div>
                </div>
                <div class="group grid grid-cols-12 gap-4 px-4 py-3 hover:bg-red-50/50 transition items-center">
                    <div class="col-span-2 sm:col-span-1 text-center text-sm text-gray-500">2</div>
                    <div class="col-span-7 font-medium text-gray-900 group-hover:text-primary transition">Chrome Rain</div>
                    <div class="col-span-3 hidden sm:block text-center text-sm text-gray-400">890K</div>
                    <div class="col-span-5 sm:col-span-3 text-right text-sm text-gray-500">3:45</div>
                </div>
                <div class="group grid grid-cols-12 gap-4 px-4 py-3 hover:bg-red-50/50 transition items-center">
                    <div class="col-span-2 sm:col-span-1 text-center text-sm text-gray-500">3</div>
                    <div class="col-span-7 font-medium text-gray-900 group-hover:text-primary transition">Neon Pulse</div>
                    <div class="col-span-3 hidden sm:block text-center text-sm text-gray-400">2.1M</div>
                    <div class="col-span-5 sm:col-span-3 text-right text-sm text-gray-500">5:01</div>
                </div>
            </div>
        </div>

        <div class="mt-8 flex flex-wrap gap-2">
            <span class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm text-gray-600">#synthwave</span>
            <span class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm text-gray-600">#retro</span>
            <span class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm text-gray-600">#chill</span>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 border-t border-gray-800 mt-auto text-center text-sm">
        &copy; 2026 Музыкальная коллекция
    </footer>
</body>
</html>
